name: ci

on:
  push:
    # staging too (2026-09-23): releases land on staging and were never
    # CI'd — CI ran only at promote, hours later, and its red email went to
    # whoever promoted, not to whoever released. Two days of red followed.
    branches: [main, staging]
  pull_request:

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A fresh checkout has no dist for ANY workspace package, and the apps
      # typecheck against them — build every packages/* first. Derived from
      # the directory, not named: this line said `@thefibre/shared` until
      # 2026-09-23, so when apps/api started importing @thefibre/mcp (v0.85.0)
      # CI went red at v0.87.1 and stayed red for two days — every machine
      # had mcp's dist already, so the local gate never noticed.
      - run: pnpm --filter "./packages/**" build

      - run: pnpm -r typecheck

      # Unit tests (testing approach §3.3 — shared + api + repo scripts;
      # fast, no DB). Integration tests need staging creds and stay local
      # (`pnpm test:integration`).
      - run: pnpm test

  build:
    name: build (web + api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Web build needs the public env vars (anon key + Supabase URL) at build
      # time for Next to inline them. Use harmless placeholders — the actual
      # build doesn't call Supabase, it just needs the strings to exist.
      # Topological filters (trailing ...) — "and its workspace deps", so
      # @thefibre/shared builds first. Never hand-chain builds (CLAUDE.md).
      - run: pnpm --filter @thefibre/web... build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - run: pnpm --filter @thefibre/api... build

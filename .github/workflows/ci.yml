name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A fresh checkout has no packages/shared/dist, and every app
      # typechecks against it — build shared first (the CLAUDE.md gotcha
      # the original template missed; first CI run failed exactly here).
      - run: pnpm --filter @thefibre/shared build

      - run: pnpm -r typecheck

      # Unit tests (testing approach §3.3 — shared + api; fast, no DB).
      - run: pnpm -r test

  build:
    name: build (web + api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Web build needs the public env vars (anon key + Supabase URL) at build
      # time for Next to inline them. Use harmless placeholders — the actual
      # build doesn't call Supabase, it just needs the strings to exist.
      # Topological filters (trailing ...) — "and its workspace deps", so
      # @thefibre/shared builds first. Never hand-chain builds (CLAUDE.md).
      - run: pnpm --filter @thefibre/web... build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - run: pnpm --filter @thefibre/api... build

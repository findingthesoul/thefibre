# fly.toml app configuration file generated for thefibre-api on 2026-05-14T17:15:01+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'thefibre-api'
primary_region = 'fra'

[build]
  dockerfile = 'apps/api/Dockerfile'

[deploy]
  release_command = "echo 'Migrations are pushed manually via supabase CLI from the dev machine — see docs.'"
  # Blue-green (2026-09-26): the API is ONE machine, and until now every deploy
  # and every `fly secrets set` restarted it — a 15 s 502 window that a client
  # could hit (Fibre session, launch list). With bluegreen Fly boots the new
  # machine beside the old one, waits for its health checks, moves traffic,
  # then destroys the old one. Still one machine at rest: the in-process
  # schedulers (billing meter, fee statements, access syncs) have no leader
  # lock, so `fly scale count 2` is NOT safe until they get one. Secrets:
  # `fly secrets set --stage …` and let scripts/deploy-api.sh apply them.
  strategy = "bluegreen"

[env]
  API_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep at least one machine running — Supabase auth hooks have a 5s
  # ceiling; a cold start eats most of that window. The base cost of one
  # shared-cpu-1x machine is negligible.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'

  [[services.http_checks]]
    interval = '30s'
    timeout = '3s'
    grace_period = '10s'
    method = 'get'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

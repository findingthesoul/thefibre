<!doctype html>
<!--
  Connections, offline.

  Served by public/sw.js when a page load fails for lack of a network. It has
  to work with NOTHING but the service worker's cache, so it is plain HTML with
  inline CSS and JS — no Next.js, no React, no framework to fail to load.

  What it does: lets somebody pick a person and write a note, and puts that
  note in the same device queue the app uses (lib/offline-notes.ts). When the
  connection returns, the app sends it. The storage keys and the entry shape
  below are a CONTRACT with that file, which shares no code with this one;
  lib/offline-notes.test.ts checks an entry written this way is read back.

  TRANSLATIONS. The rest of the app keeps every string in a typed catalog where
  a missing translation fails the build. That cannot reach a static file, so
  this page carries its own six-locale dictionary, and offline-page.test.ts
  fails if any locale is missing a key the English one has. A deliberate,
  checked exception rather than a silent one.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Connections</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --ink:#0f1115; --muted:#5b6270; --line:#dfe3ea; --surface:#fff; --ground:#eef1f6; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#eceef2; --muted:#9aa1ad; --line:#2a2f37; --surface:#0d0f12; --ground:#15181d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--ground); }
  header { background:var(--surface); border-bottom:1px solid var(--line); padding:14px 18px; display:flex; align-items:center; gap:10px; }
  header img { width:28px; height:28px; border-radius:7px; }
  header strong { font-size:15px; }
  main { max-width:560px; margin:0 auto; padding:18px; }
  .banner { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; color:var(--muted); font-size:14px; }
  label { display:block; margin:18px 0 6px; font-size:13px; font-weight:600; }
  input, textarea { width:100%; font:inherit; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  textarea { min-height:120px; resize:vertical; }
  ul { list-style:none; margin:6px 0 0; padding:0; max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
  li button { width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:10px 12px; font:inherit; color:inherit; }
  li:last-child button { border-bottom:0; }
  li button[aria-pressed="true"] { font-weight:600; background:var(--ground); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; }
  .primary { background:var(--ink); color:var(--surface); border:0; border-radius:8px; padding:10px 16px; font:inherit; font-weight:600; }
  .primary:disabled { opacity:.4; }
  .quiet { background:none; border:1px solid var(--line); border-radius:8px; padding:9px 14px; font:inherit; color:inherit; }
  .status { color:var(--muted); font-size:13px; min-height:1.2em; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <img src="/icon-192.png" alt="">
  <strong>Connections</strong>
</header>
<main>
  <div class="banner" id="banner"></div>

  <div id="empty" hidden>
    <p class="status" id="emptyText"></p>
  </div>

  <form id="form" hidden>
    <label for="search" id="whoLabel"></label>
    <input id="search" type="search" autocomplete="off">
    <ul id="people"></ul>

    <label for="body" id="whatLabel"></label>
    <textarea id="body"></textarea>

    <div class="row">
      <span class="status" id="status"></span>
      <button type="submit" class="primary" id="save" disabled></button>
    </div>
  </form>

  <div class="row">
    <span class="status" id="waiting"></span>
    <button type="button" class="quiet" id="retry"></button>
  </div>
</main>

<script>
(function () {
  // ── Translations — six locales, kept in step by offline-page.test.ts ──────
  var I18N = {
    en: {
      banner: 'You are offline. Anything you write here is kept on this phone and sent when the connection comes back.',
      who: 'Who is this about?', search: 'Search people', what: 'What was said',
      save: 'Keep this note', saved: 'Kept on this phone.', waiting: '{n} waiting to send',
      retry: 'Try again', empty: 'No people are stored on this phone yet. Open Connections once while online and they will be here next time.',
      pick: 'Pick a person first.',
      nostore: 'This browser is not letting Connections keep anything on this device, so a note cannot be written offline here. Nothing you type would survive.'
    },
    nl: {
      banner: 'Je bent offline. Wat je hier schrijft wordt op deze telefoon bewaard en verstuurd zodra de verbinding terug is.',
      who: 'Over wie gaat dit?', search: 'Zoek mensen', what: 'Wat er gezegd is',
      save: 'Bewaar deze notitie', saved: 'Bewaard op deze telefoon.', waiting: '{n} wacht op verzenden',
      retry: 'Opnieuw proberen', empty: 'Er staan nog geen mensen op deze telefoon. Open Connections één keer met verbinding, dan staan ze er de volgende keer.',
      pick: 'Kies eerst een persoon.',
      nostore: 'Deze browser laat Connections niets op dit apparaat bewaren, dus hier kun je offline geen notitie schrijven. Wat je typt zou verloren gaan.'
    },
    es: {
      banner: 'Estás sin conexión. Lo que escribas aquí se guarda en este teléfono y se envía cuando vuelva la conexión.',
      who: '¿Sobre quién es?', search: 'Buscar personas', what: 'Qué se dijo',
      save: 'Guardar esta nota', saved: 'Guardado en este teléfono.', waiting: '{n} pendientes de enviar',
      retry: 'Reintentar', empty: 'Aún no hay personas guardadas en este teléfono. Abre Connections una vez con conexión y estarán aquí la próxima vez.',
      pick: 'Elige primero a una persona.',
      nostore: 'Este navegador no deja que Connections guarde nada en este dispositivo, así que aquí no se puede escribir una nota sin conexión. Lo que escribas se perdería.'
    },
    pt: {
      banner: 'Estás sem ligação. O que escreveres aqui fica guardado neste telemóvel e é enviado quando a ligação voltar.',
      who: 'Sobre quem é?', search: 'Procurar pessoas', what: 'O que foi dito',
      save: 'Guardar esta nota', saved: 'Guardado neste telemóvel.', waiting: '{n} à espera de envio',
      retry: 'Tentar de novo', empty: 'Ainda não há pessoas guardadas neste telemóvel. Abre o Connections uma vez com ligação e estarão cá da próxima vez.',
      pick: 'Escolhe primeiro uma pessoa.',
      nostore: 'Este navegador não deixa o Connections guardar nada neste dispositivo, por isso aqui não é possível escrever uma nota sem ligação. O que escreveres perder-se-ia.'
    },
    de: {
      banner: 'Du bist offline. Was du hier schreibst, bleibt auf diesem Telefon und wird gesendet, sobald die Verbindung zurück ist.',
      who: 'Um wen geht es?', search: 'Personen suchen', what: 'Was gesagt wurde',
      save: 'Notiz behalten', saved: 'Auf diesem Telefon behalten.', waiting: '{n} warten auf das Senden',
      retry: 'Erneut versuchen', empty: 'Auf diesem Telefon sind noch keine Personen gespeichert. Öffne Connections einmal mit Verbindung, dann sind sie beim nächsten Mal da.',
      pick: 'Wähle zuerst eine Person.',
      nostore: 'Dieser Browser lässt Connections nichts auf diesem Gerät speichern, daher kann hier offline keine Notiz geschrieben werden. Was du tippst, ginge verloren.'
    },
    fr: {
      banner: 'Vous êtes hors ligne. Ce que vous écrivez ici reste sur ce téléphone et sera envoyé dès le retour de la connexion.',
      who: 'De qui s’agit-il ?', search: 'Rechercher des personnes', what: 'Ce qui a été dit',
      save: 'Garder cette note', saved: 'Gardé sur ce téléphone.', waiting: '{n} en attente d’envoi',
      retry: 'Réessayer', empty: 'Aucune personne n’est encore enregistrée sur ce téléphone. Ouvrez Connections une fois en ligne et elles seront là la prochaine fois.',
      pick: 'Choisissez d’abord une personne.',
      nostore: 'Ce navigateur ne laisse pas Connections garder quoi que ce soit sur cet appareil, donc aucune note ne peut être écrite hors ligne ici. Ce que vous tapez serait perdu.'
    }
  };
  var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
  var T = I18N[lang] || I18N.en;
  document.documentElement.lang = I18N[lang] ? lang : 'en';

  // ── The contract with lib/offline-notes.ts ──────────────────────────────────
  var NOTE_PREFIX = 'connections:offline-note:';
  var WORKSPACE_KEY = 'connections:workspace';
  var PEOPLE_KEY = 'connections:people';

  function store() { try { return window.localStorage; } catch (e) { return null; } }

  function workspace() { var s = store(); try { return s ? s.getItem(WORKSPACE_KEY) : null; } catch (e) { return null; } }

  function people() {
    var s = store(); if (!s) return [];
    try {
      var p = JSON.parse(s.getItem(PEOPLE_KEY) || 'null');
      // Never another workspace's people — mirrors cachedPeople().
      if (!p || p.workspaceId !== workspace() || !Array.isArray(p.people)) return [];
      return p.people;
    } catch (e) { return []; }
  }

  function waitingCount() {
    var s = store(); if (!s) return 0; var ws = workspace(); var n = 0;
    try {
      for (var i = 0; i < s.length; i++) {
        var k = s.key(i);
        if (!k || k.indexOf(NOTE_PREFIX) !== 0) continue;
        try { var e = JSON.parse(s.getItem(k)); if (e && (e.workspaceId === null || e.workspaceId === ws)) n++; } catch (x) {}
      }
    } catch (e) {}
    return n;
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    // Fallback for browsers without randomUUID: RFC 4122 v4 from getRandomValues.
    var b = new Uint8Array(16); crypto.getRandomValues(b);
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    var h = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }

  /** Written in EXACTLY the shape queueNote() writes. */
  function queue(personId, body) {
    var s = store(); if (!s) return false;
    var tz; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
    var ref = uuid();
    var payload = { client_ref: ref, person_id: personId, body: body, kind: 'note', is_draft: false, happened_at: new Date().toISOString() };
    if (tz) payload.happened_tz = tz;
    try {
      s.setItem(NOTE_PREFIX + ref, JSON.stringify({ payload: payload, queuedAt: Date.now(), workspaceId: workspace() }));
      return true;
    } catch (e) { return false; }
  }

  // ── The page ───────────────────────────────────────────────────────────────
  var $ = function (id) { return document.getElementById(id); };
  $('banner').textContent = T.banner;
  $('whoLabel').textContent = T.who;
  $('search').placeholder = T.search;
  $('whatLabel').textContent = T.what;
  $('save').textContent = T.save;
  $('retry').textContent = T.retry;

  var all = people();
  var chosen = null;

  // SAY WHAT IS TRUE. The banner promises the note is kept on this phone, and
  // with storage blocked — private mode on some browsers, a sandboxed frame,
  // storage cleared by policy — that promise is false. Found by opening this
  // page in a real browser that happened to block storage: it rendered
  // cleanly, and cheerfully told the reader their words would be kept.
  var canStore = (function () {
    var s = store(); if (!s) return false;
    try { s.setItem('connections:probe', '1'); s.removeItem('connections:probe'); return true; }
    catch (e) { return false; }
  })();
  if (!canStore) $('banner').textContent = T.nostore;

  function renderWaiting() {
    var n = waitingCount();
    $('waiting').textContent = n ? T.waiting.replace('{n}', n) : '';
  }

  function renderPeople() {
    var q = $('search').value.trim().toLowerCase();
    var list = $('people'); list.innerHTML = '';
    all.filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) !== -1; })
      .slice(0, 50)
      .forEach(function (p) {
        var li = document.createElement('li');
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = p.name; // textContent, never innerHTML: a name is data
        b.setAttribute('aria-pressed', String(chosen === p.id));
        b.onclick = function () { chosen = p.id; renderPeople(); update(); };
        li.appendChild(b); list.appendChild(li);
      });
  }

  function update() {
    $('save').disabled = !chosen || $('body').value.trim().length < 2;
  }

  if (!canStore) {
    // Nothing to offer: no list to pick from and nowhere to put a note.
  } else if (!all.length) {
    $('empty').hidden = false;
    $('emptyText').textContent = T.empty;
  } else {
    $('form').hidden = false;
    renderPeople();
  }

  $('search').addEventListener('input', renderPeople);
  $('body').addEventListener('input', update);

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!chosen) { $('status').textContent = T.pick; return; }
    if (queue(chosen, $('body').value.trim())) {
      $('status').textContent = T.saved;
      $('body').value = ''; chosen = null; renderPeople(); update(); renderWaiting();
    }
  });

  // Back online: go to Today, where the app sends the queue.
  $('retry').addEventListener('click', function () { location.href = '/today'; });
  window.addEventListener('online', function () { location.href = '/today'; });

  renderWaiting();
})();
</script>
</body>
</html>

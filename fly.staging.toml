# Staging twin of fly.toml — see docs/environments.md.
# Deploy: fly deploy -c fly.staging.toml --remote-only
#
# Differences from prod, both deliberate:
#  - one machine pinned (since 2026-09-03): staging now runs the real email
#    hook (5s ceiling — cold start eats it) and the in-process message
#    scheduler, which only ticks while a machine is awake. ~€2-3/mo.

app = 'thefibre-api-staging'
primary_region = 'fra'

[build]
  dockerfile = 'apps/api/Dockerfile'

[deploy]
  release_command = "echo 'Migrations are pushed manually via supabase CLI — see docs/environments.md Phase 3.'"
  # Blue-green (2026-09-26): the API is ONE machine, and until now every deploy
  # and every `fly secrets set` restarted it — a 15 s 502 window that a client
  # could hit (Fibre session, launch list). With bluegreen Fly boots the new
  # machine beside the old one, waits for its health checks, moves traffic,
  # then destroys the old one. Still one machine at rest: the in-process
  # schedulers (billing meter, fee statements, access syncs) have no leader
  # lock, so `fly scale count 2` is NOT safe until they get one. Secrets:
  # `fly secrets set --stage …` and let scripts/deploy-api.sh apply them.
  strategy = "bluegreen"

[env]
  API_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

  [[http_service.checks]]
    interval = '30s'
    timeout = '3s'
    grace_period = '10s'
    method = 'get'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# Staging twin of fly.toml — see docs/environments.md.
# Deploy: ./scripts/deploy-api.sh staging (never a bare `fly deploy`: the
# script refuses uncommitted source and a wrong HEAD, and asks the runway).
#
# Differences from prod, both deliberate:
#  - one machine pinned (since 2026-09-03): staging now runs the real email
#    hook (5s ceiling — cold start eats it) and the in-process message
#    scheduler, which only ticks while a machine is awake. ~€2-3/mo.

app = 'thefibre-api-staging'
primary_region = 'fra'

[build]
  dockerfile = 'apps/api/Dockerfile'

[deploy]
  release_command = "echo 'Migrations are pushed manually via supabase CLI — see docs/environments.md Phase 3.'"
  # Blue-green (2026-09-26): the API is ONE machine, and until now every deploy
  # and every `fly secrets set` restarted it — a 15 s 502 window that a client
  # could hit (Fibre session, launch list). With bluegreen Fly boots the new
  # machine beside the old one, waits for its health checks, moves traffic,
  # then destroys the old one. Secrets: `fly secrets set --stage …` and let
  # scripts/deploy-api.sh apply them.
  #
  # Still one machine at rest. The in-process schedulers are no longer the
  # reason: every tick runs under a lease (apps/api/src/lib/scheduler-lease.ts,
  # same day), which is what makes the two-process window above safe. What a
  # SECOND machine would still break is state held in one process's memory:
  # the assistant's pending approvals (lib/assistant/pending.ts) would be
  # confirmed on the machine that never saw them, an /admin/plans edit clears
  # the plan cache on one machine only (the other serves the old plan for up
  # to a minute), and the rate-limit windows count per machine. Settle those
  # before `fly scale count 2`. (Corrected 2026-10-01: this comment said the
  # schedulers had no lock for five days after they got one.)
  strategy = "bluegreen"

[env]
  API_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

  [[http_service.checks]]
    interval = '30s'
    timeout = '3s'
    grace_period = '10s'
    method = 'get'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
